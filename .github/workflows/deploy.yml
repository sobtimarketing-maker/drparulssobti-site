# Builds the site and publishes it on GitHub Pages (free for public repositories).
# Runs on every push to main, and once a day just after midnight India time so a
# post goes live on its date even when nothing was pushed that day.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 18 * * *"   # 00:10 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python3 build.py
          echo "drparulssobti.com" > site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
